name: Validate and build add-on

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON and project structure
        run: python tools/validate.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          tmp="$(mktemp -d)"
          cp -R addon/Herobrine_BP/scripts/. "$tmp/"
          for f in "$tmp"/*.js; do mv "$f" "${f%.js}.mjs"; done
          for f in "$tmp"/*.mjs; do
            sed -i 's/from "\.\/\([^\"]*\)\.js"/from ".\/\1.mjs"/g' "$f"
            node --check "$f"
          done
      - name: Build mcaddon
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Herobrine-v0.14
          path: dist/*.mcaddon
