name: MineBoxUltimate
version: ${version}
main: pl.minebox.ultimate.MineBoxUltimatePlugin
api-version: '1.20'
author: MineBox
website: https://mine-box.pl
description: Local MineBox plugin for PaperMC, timed VIP/SVIP, server status and optional local panel sync.

commands:
  minebox:
    description: Main MineBox Ultimate admin command.
    usage: /minebox <status|reload|sync|vip>
  vip:
    description: Shows VIP status for the player.
    usage: /vip

permissions:
  minebox.admin:
    description: Allows managing MineBox Ultimate plugin.
    default: op
  minebox.vip:
    description: Basic VIP permission granted by MineBox Ultimate.
    default: false
  minebox.svip:
    description: SVIP permission granted by MineBox Ultimate.
    default: false
