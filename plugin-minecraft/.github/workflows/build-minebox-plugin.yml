name: Build MineBoxUltimate Plugin

on:
  push:
    paths:
      - 'plugin-minecraft/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugin-minecraft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin JAR
        run: gradle build

      - name: Upload MineBoxUltimate.jar
        uses: actions/upload-artifact@v4
        with:
          name: MineBoxUltimate.jar
          path: plugin-minecraft/build/libs/MineBoxUltimate.jar
