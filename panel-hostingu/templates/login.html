<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineBox Panel — logowanie</title>
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo-mark">MB</div>
    <p class="eyebrow">MineBox Panel</p>
    <h1>Zaloguj się</h1>
    <p class="muted">Panel do zarządzania kupionymi hostingami i fizycznymi MineBoxami.</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post" class="login-form">
      <label>E-mail
        <input type="email" name="email" value="{{ admin_email }}" required>
      </label>
      <label>Hasło
        <input type="password" name="password" placeholder="Wpisz hasło" required>
      </label>
      <button type="submit">Wejdź do panelu</button>
    </form>

    <p class="hint">Wersja testowa. Prawdziwe hasło ustaw przez zmienne środowiskowe na serwerze.</p>
  </main>
</body>
</html>
